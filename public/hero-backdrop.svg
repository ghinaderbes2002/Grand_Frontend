<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!--
    Hero backdrop — Grand Group's navy field, drawn rather than photographed.

    The brand's navy (#242b66) deepened toward the corners, with a low red bloom
    where the arcs sit and a grain so the gradient does not band on wide
    screens. The animated arcs themselves are rendered by `StoreHero` on top of
    this, so they can move; this file is only the ground they move over.

    Swap it for a photograph by dropping the file into `public/` and pointing
    `StoreHero`'s `image` prop at it — nothing else has to change.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3175" />
      <stop offset="0.5" stop-color="#1c2257" />
      <stop offset="1" stop-color="#0e1238" />
    </linearGradient>

    <radialGradient id="bloom-red" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#e12027" stop-opacity="0.16" />
      <stop offset="0.55" stop-color="#e12027" stop-opacity="0.03" />
      <stop offset="1" stop-color="#e12027" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bloom-light" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#8f9bff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#8f9bff" stop-opacity="0" />
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#field)" />
  <rect width="1600" height="900" fill="url(#bloom-light)" />
  <rect width="1600" height="900" fill="url(#bloom-red)" />

  <!-- Faint concentric rings: the arcs' circles, completed, as a quiet echo. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <circle cx="1310" cy="420" r="260" />
    <circle cx="1310" cy="420" r="380" />
    <circle cx="1310" cy="420" r="520" />
    <circle cx="1310" cy="420" r="680" />
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.07" />
</svg>
