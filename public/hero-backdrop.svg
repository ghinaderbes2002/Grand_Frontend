<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!--
    Hero backdrop, drawn rather than photographed.

    Swap it for a real photograph by dropping the file into `public/` and
    pointing `StoreHero`'s `image` prop at it — nothing else has to change.
    Kept as SVG so it costs no network round-trip, scales to any viewport, and
    stays neutral with the rest of the palette.
  -->
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f33" />
      <stop offset="0.55" stop-color="#1a1d20" />
      <stop offset="1" stop-color="#0b0c0d" />
    </linearGradient>

    <radialGradient id="lift" cx="0.28" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Surface tooth. Without it the gradients band on wide screens. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#slab)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#lift)" />

  <!-- Sheets of stock, fanned. The one form a printing supplier is built on. -->
  <g opacity="0.08" fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="980" y="120" width="420" height="560" rx="10" transform="rotate(-9 1190 400)" />
    <rect x="1040" y="150" width="420" height="560" rx="10" transform="rotate(-3 1250 430)" />
    <rect x="1100" y="180" width="420" height="560" rx="10" transform="rotate(4 1310 460)" />
  </g>

  <!-- A sweep across the lower third, to seat the copy. -->
  <path
    d="M-40 700 C 300 610, 520 800, 860 720 C 1180 645, 1380 780, 1660 700 L1660 940 L-40 940 Z"
    fill="#000000"
    opacity="0.30"
  />

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.06" />
</svg>
